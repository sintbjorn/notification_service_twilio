[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["notifications/migrations"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.lint.isort]
known-first-party = ["notifications", "notifier"]

[tool.coverage.run]
source = ["notifications", "notifier"]
omit = ["*/migrations/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
