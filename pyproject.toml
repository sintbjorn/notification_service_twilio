[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.lint.isort]
known-first-party = ["notifications", "notifier"]

[tool.coverage.run]
source = ["notifications", "notifier"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
