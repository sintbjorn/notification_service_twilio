services:
  web:
    build: .
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: notifier.settings.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: .
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: notifier.settings.local
    command: celery -A notifier worker -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: notifier.settings.local
    command: celery -A notifier beat -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: notif
      POSTGRES_USER: notif
      POSTGRES_PASSWORD: notif
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notif -d notif"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  mailpit:
    image: axllent/mailpit:v1.29.7
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      default:
        aliases:
          - mailhog

volumes:
  postgres_data:
  redis_data:
